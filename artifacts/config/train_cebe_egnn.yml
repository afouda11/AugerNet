# =============================================================================
#  AugerNet — CEBE EGNN main result (updated to the current config schema)
# =============================================================================
#
#  Reproduces the paper's main equivariant GNN (EGNN) carbon-1s CEBE model.
#  Updated from the legacy config to the current schema used by the Auger study:
#    - exp_split            -> cebe_exp_split
#    - added train_data_file / cebe_eval_data_file
#    - added train_frac / train_subsample_seed (data-efficiency knobs; full data here)
#    - cebe_loss: mse  (the paper trains with an MSE loss)
#  All model hyper-parameters are unchanged from the published run.
#
#  Run with:
#    python -m augernet --config configs/train_EQ.yml
# =============================================================================

# ── Identity ─────────────────────────────────────────────────────────────────
model: cebe-gnn          # cebe-gnn | auger-gnn | cnn
mode: train              # cv | train | param | evaluate | predict

# ── Data files (in AugerNet/data/processed) ──────────────────────────────────
train_data_file:     'gnn_calc_cebe_data.pt'
cebe_eval_data_file: 'gnn_exp_cebe_data.pt'

# ── Run flags ────────────────────────────────────────────────────────────────
run_evaluation: true
# 113 exp cebe mols split into: val (assists fold/param search) + eval (hold-out)
cebe_exp_split: 'both'   # all | val | eval | both
run_unit_tests: true     # permutation + rotational invariance/equivariance checks
cp_alpha: 0.1            # split-conformal miscoverage level (90% interval)

# ── K-fold split ─────────────────────────────────────────────────────────────
n_folds: 10
train_fold: 5
split_method: butina
butina_cutoff: 0.65

# ── Training-set size (full data for the headline result) ────────────────────
train_frac: 1.0
train_subsample_seed: 0

# ── Node feature specification ───────────────────────────────────────────────
#   Atom types: 0=skipatom_200, 1=skipatom_30, 2=onehot,
#   Other:      3=atomic_be,    4=mol_be (DO NOT USE for CEBE),
#               5=e_score,      6=env_onehot
feature_keys: '035'      # skipatom_200 + atomic_be + e_score

# ── Model hyper-parameters ───────────────────────────────────────────────────
layer_type: EQ           # EQ (equivariant) | IN (invariant)
hidden_channels: 64
n_layers: 3
num_epochs: 300
patience: 30
batch_size: 24
learning_rate: 0.001
random_seed: 42
dropout: 0.1
cebe_loss: 'mse'         # paper trains with MSE

# ── Optimizer ────────────────────────────────────────────────────────────────
optimizer_type: adamw
weight_decay: 5.0e-4
gradient_clip_norm: 0.5
warmup_epochs: 10
min_lr: 1.0e-7

# ── Scheduler ────────────────────────────────────────────────────────────────
scheduler_type: 'cosine' # cosine | onecycle
pct_start: 0.3           # OneCycleLR only

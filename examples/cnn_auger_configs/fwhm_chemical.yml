# =============================================================================
#  AugerNet — Auger CNN Default Configuration
# =============================================================================
#
#  Run with:
#    python -m augernet --model auger-cnn --mode train --config configs/auger_cnn_default.yml
#
# =============================================================================

# ── Identity ─────────────────────────────────────────────────────────────────
model: auger-cnn
mode: param

# ── Run flags ────────────────────────────────────────────────────────────────
run_evaluation: true

# ── K-fold ───────────────────────────────────────────────────────────────────
n_folds: 10
train_fold: 8
split_method: butina

# ── Class merging ────────────────────────────────────────────────────────────
#   none | chemical 
merge_scheme: chemical
film_inputs: none  # 'none' | 'be' | 'mol_size' | 'both

# ── Model hyper-parameters ───────────────────────────────────────────────────
architecture:
  parallel_filters:       [12, 12, 12]
  parallel_kernel_sizes:  [5, 10, 15]
  sequential_filters:     [12, 12]
  sequential_kernel_size: [15, 15]
  conv_dropout:           0.2
  pool_output:           32
  stride:                 1
  film_hidden:            64

num_epochs: 500
patience: 40
batch_size: 64
learning_rate: 3.0e-4
weight_decay: 5.0e-4
label_smoothing: 0.1
#augment_noise_std: 0.005
random_seed: 42

# ── LR schedule ──────────────────────────────────────────────────────────────
scheduler_type: cosine

# ── Input representation ─────────────────────────────────────────────────────
cebe_augment: false

# ── Broadening ───────────────────────────────────────────────────────────────
fwhm: 1.6
min_ke: 200.0
max_ke: 275.0
n_points: 751
normalize_intensity: true

# Hyperparameter search grid
param_grid:
  fwhm:  [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]